<!DOCTYPE html>
<html>
<head>
  <style>
    /* Custom styles for portfolio */
    .portfolio-page {
      background-color: black;
      color: white;
      min-height: 100vh;
      padding: 2rem;
    }

    .nav-top {
      display: flex;
      justify-content: flex-end;
      gap: 1.5rem;
      margin-bottom: 4rem;
    }

    .nav-link {
      padding: 0.5rem;
      color: white;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-link:hover {
      color: #9ca3af;
    }

    /* Hero section styles */
    .hero-section {
    display: grid;
    grid-template-columns: 1.5fr 1fr;  /* Left column larger than right */
    gap: 3rem;
    align-items: start;
}

.hero-left {
    display: flex;
    flex-direction: column;
    gap: 3rem;  /* Space between sections */
}

.hero-right {
    position: sticky;  /* Makes skills and competencies stick while scrolling */
    top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
}

.skills-title {
  font-size: 2.5rem;  /* Larger size */
  font-weight: bold;
  color: white;
  margin-bottom: 1.5rem;
  letter-spacing: 0.05em;
}

.skills-stack {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Rest of your existing styles */

@media (max-width: 768px) {
  .hero-section {
    grid-template-columns: 1fr;  /* Stack on mobile */
  }
}

.intro-section {
  margin-bottom: 1rem;
}

.author-name {
  font-size: 2.5rem;
  font-weight: bold;
  margin-bottom: 0.5rem;
  color: white;
}

.author-bio {
  font-size: 1.125rem;
  color: #9ca3af;
  line-height: 1.5;
}

.section-label {
  font-size: 1rem;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}

.skills-stack {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.cta-buttons {
  display: flex;
  gap: 1rem;
  margin-top: 1rem;
}

.cta-button {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.25rem;
  border-radius: 0.5rem;
  font-size: 0.875rem;
  font-weight: 500;
  text-decoration: none;
  transition: transform 0.2s;
}

.cta-button:hover {
  transform: translateY(-2px);
}

.linkedin-button {
  background-color: #0077b5;
  color: white;
}

.resume-button {
  background-color: white;
  color: black;
  border: 1px solid #333;
}

.resume-button:hover {
  background-color: #a3e635;
}

    /* Profile card styles */
    .profile-card {
      background-color: white;
      color: black;
      padding: 1rem;
      border-radius: 1.5rem;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-image {
      width: 100%;
      height: auto;
      border-radius: 1rem;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .profile-name {
      font-size: 1.75rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .profile-bio {
      color: #666;
      margin-bottom: 1rem;
      line-height: 1.5;
      text-align: center;
    }

    .social-links {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      background-color: #0077b5;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      transition: background-color 0.3s;
      font-size: 0.875rem;
    }

    .social-link:hover {
      background-color: #005885;
    }

    .social-link img {
      width: 20px;
      height: 20px;
      margin-right: 0.5rem;
    }

    /* Title and stats styles */
    .title-stats-section {
      margin-bottom: 1rem;
    }

    .title-large {
      font-size: 3.75rem;
      font-weight: bold;
      line-height: 1;
      margin: 0;
    }

    .title-gray {
      color: #4b5563;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 2rem;
    }

    .stat-number {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      white-space: nowrap;
    }

    .stat-label {
      font-size: 0.875rem;
      color: #6b7280;
      white-space: pre-line;
    }

    .core-section {
  margin-top: 3rem;
}
/* Competencies */
.competencies-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  margin-top: 1.5rem;
}

.competency-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background: #1a1a1a;
  border-radius: 0.75rem;
  transition: transform 0.2s;
}

.competency-item:hover {
  transform: translateY(-2px);
}

.competency-icon {
  width: 40px;
  height: 40px;
  border-radius: 0.375rem;
  padding: 0.375rem;
  background: white;
}

.competency-info h3 {
  color: white;
  font-size: 1rem;
  font-weight: 500;
  margin: 0;
}

.competency-info p {
  color: #9ca3af;
  font-size: 0.875rem;
  margin: 0.25rem 0 0 0;
}

/* Title styling */
.section-title {
  margin-bottom: 1.5rem;
}

.title-large {
  font-size: 3.75rem;
  font-weight: bold;
  line-height: 1;
  margin: 0;
}

.title-gray {
  color: #4b5563;
}
    /* Recent Projects styles */
    .projects-preview {
      margin: 2rem 0;
    }

    .section-title {
      margin-bottom: 1.5rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .project-card {
      background-color: #ef4444;
      padding: 1.5rem;
      border-radius: 1rem;
      transition: transform 0.3s;
    }

    .project-card:hover {
      transform: translateY(-4px);
    }

    .project-card h3 {
      font-size: 2.25rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: white;
    }

    .project-card p {
      font-size: 0.875rem;
      color: white;
    }

    .project-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

.project-card-blue {
  background-color: #3b82f6; /* Replace with your desired blue shade */
  padding: 1.5rem;
  border-radius: 1rem;
  transition: transform 0.3s;
}

.project-card-blue:hover {
  transform: translateY(-4px);
}

.project-card-blue h3,
.project-card-blue p {
  color: white;
}


    /* Skills section styles */
    .skills-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .skill-card {
      padding: 1.25rem;
      border-radius: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s;
    }

    .skill-card:hover {
      transform: translateY(-4px);
    }

    .skill-orange {
      background-color: #f97316;
    }

    .skill-green {
      background-color: #a3e635;
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      .hero-section {
        grid-template-columns: 1fr;
      }
      
      .projects-grid {
        grid-template-columns: 1fr;
      }
    }
